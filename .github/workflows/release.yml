name: Release Swift SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: swift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    environment: swift-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify package version
        run: node scripts/check-public-release-version.mjs
      - run: swift test
      - name: Create and sign public source archive
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="linguaflow-swift-$version.tar.gz"
          git archive --format=tar.gz --prefix="linguaflow-swift-$version/" -o "$archive" "$GITHUB_SHA"
          shasum -a 256 "$archive" > "$archive.sha256"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --armor --detach-sign "$archive"
      - name: Attest source archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-swift-*.tar.gz
      - name: Generate Swift SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: linguaflow-swift.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest Swift SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-swift-*.tar.gz
          sbom-path: linguaflow-swift.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="linguaflow-swift-$version.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" "$archive.asc" \
            linguaflow-swift.cdx.json \
            --verify-tag --generate-notes --title "LinguaFlow Swift $version"
